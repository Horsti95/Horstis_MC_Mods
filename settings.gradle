pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'horstis-mc-mods'

include ':core'

[
	'todesort', 'afk', 'killmagnet', 'anvilfix', 'keepmoving', 'totem', 'holzsaege',
	'deathswap', 'tag', 'sit', 'bounty', 'mobgriefing', 'ernte',
	'juggernaut', 'pets', 'giftburden', 'lifesteal', 'graves', 'manhunt', 'events', 'nemesis',
	'wrapped', 'toolguard', 'refill', 'spawnguard'
].each { include ":mods:${it}" }

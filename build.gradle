plugins {
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	version = project.mod_version
	group = project.maven_group

	base {
		archivesName = "horsti-${project.name}"
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}

	processResources {
		inputs.property 'version', project.version
		filesMatching('fabric.mod.json') {
			expand 'version': project.version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = 'UTF-8'
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}

// Alle Mod-Subprojekte (nicht :core) haengen von core ab und betten es per Jar-in-Jar ein.
subprojects.findAll { it.path.startsWith(':mods:') }.each { p ->
	p.dependencies {
		implementation p.project(':core')
		include p.project(':core')
	}
}

// Hilfstask fuer CI-API-Inspektion: schreibt den Compile-Klassenpfad von :core,
// damit ein Workflow-Schritt per javap echte 26.2-Signaturen ausgeben kann.
tasks.register('printCoreClasspath') {
	doLast {
		def core = project(':core')
		file('build').mkdirs()
		file('build/core-classpath.txt').text = core.sourceSets.main.compileClasspath.asPath
	}
}

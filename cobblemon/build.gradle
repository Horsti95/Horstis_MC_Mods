// Eigene Toolchain, nicht die des 26.2-Builds.
//
// Warum nicht einfach Loom 1.17 wie im Hauptbuild: der lehnt
// officialMojangMappings() ab ("Cannot use Mojang mappings in a non-obfuscated
// environment"). 26.x wird unobfuskiert ausgeliefert, 1.21.1 nicht — Loom 1.17
// kann diesen Zweig also gar nicht bauen.
//
// Warum nicht ueber "plugins { id 'net.fabricmc.fabric-loom' }": Fabric hat die
// Plugin-Marker der alten Loom-Zeilen abgeraeumt (per CI geprueft, 1.7-SNAPSHOT
// ist weg). Das Artefakt selbst liegt weiter im Maven, also holen wir es direkt
// ueber den buildscript-Klassenpfad. Gradle 8.12 + Java 21 dazu.
buildscript {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath 'net.fabricmc:fabric-loom:1.9.2'
	}
}

subprojects {
	apply plugin: 'fabric-loom'

	version = project.mod_version
	group = project.maven_group

	base {
		archivesName = "horsti-${project.name}"
	}

	repositories {
		// Cobblemon selbst — erst noetig, wenn eine Mod gegen dessen API compiliert.
		// cobble-keys liest nur die Keybind-Registry und kommt ohne aus.
		maven {
			name = 'ImpactDev'
			url = 'https://maven.impactdev.net/repository/development/'
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		// Mojang-Mappings wie im 26.2-Build, damit Namen zwischen beiden Zweigen gleich bleiben.
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}

	processResources {
		inputs.property 'version', project.version
		filesMatching('fabric.mod.json') {
			expand 'version': project.version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
		it.options.encoding = 'UTF-8'
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}
}

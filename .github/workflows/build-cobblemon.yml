name: build-cobblemon

# Eigener Job, weil der Cobblemon-Zweig auf Minecraft 1.21.1 baut und sich mit dem
# 26.2-Build weder Klassenpfad noch Mappings teilen darf.
on:
  push:
    paths:
      - 'cobblemon/**'
      - '.github/workflows/build-cobblemon.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cobblemon
    steps:
      - uses: actions/checkout@v4

      # Java 21, nicht 25: Gradle 8.8 (noetig fuer Loom 1.7) laeuft nicht auf 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Fabric raeumt alte Snapshots ab (1.7-SNAPSHOT ist weg). Der Container der
      # Claude-Session kommt nicht an maven.fabricmc.net, also fragt CI nach, was es
      # wirklich gibt. Abschaltbar mit "if: false", sobald die Versionen stehen.
      - name: Toolchain probe
        continue-on-error: true
        run: |
          v() { curl -sS "$1" | tr '<' '\n' | sed -n 's/^version>//p'; }
          echo "=== fabric-loom (letzte 40) ==="
          v https://maven.fabricmc.net/net/fabricmc/fabric-loom/fabric-loom/maven-metadata.xml | tail -40
          echo "=== fabric-api fuer 1.21.1 (letzte 8) ==="
          v https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep '1\.21\.1' | tail -8
          echo "=== fabric-loader (letzte 12) ==="
          v https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | tail -12

      - name: Build Cobblemon add-ons
        run: ./gradlew build --continue

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horsti-cobblemon
          path: cobblemon/*/build/libs/*.jar
          if-no-files-found: ignore

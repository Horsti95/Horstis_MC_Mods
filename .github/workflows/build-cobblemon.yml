name: build-cobblemon

# Eigener Job, weil der Cobblemon-Zweig auf Minecraft 1.21.1 baut und sich mit dem
# 26.2-Build weder Klassenpfad noch Mappings teilen darf.
on:
  push:
    paths:
      - 'cobblemon/**'
      - '.github/workflows/build-cobblemon.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cobblemon
    steps:
      - uses: actions/checkout@v4

      # Java 21, nicht 25: Gradle 8.8 (noetig fuer Loom 1.7) laeuft nicht auf 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Fabric raeumt alte Snapshots ab (1.7-SNAPSHOT ist weg). Der Container der
      # Claude-Session kommt nicht an maven.fabricmc.net, also fragt CI nach, was es
      # wirklich gibt. Abschaltbar mit "if: false", sobald die Versionen stehen.
      - name: Toolchain probe
        continue-on-error: true
        run: |
          # Bestaetigt (Juli 2026): Fabric hat die Plugin-Marker der alten Loom-Zeilen
      # abgeraeumt, die Artefakte liegen aber noch da — deshalb der buildscript-Weg
      # in cobblemon/build.gradle. Probe bleibt fuer den naechsten Versionswechsel.
      - name: Toolchain probe
        if: false
        continue-on-error: true
        run: |
          echo "=== fabric-loom: Artefakt-Verzeichnis ==="
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/ \
            | grep -oE '>[0-9][^<]*/<' | tr -d '></' | tail -60

      - name: Build Cobblemon add-ons
        run: ./gradlew build --continue

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horsti-cobblemon
          path: cobblemon/*/build/libs/*.jar
          if-no-files-found: ignore

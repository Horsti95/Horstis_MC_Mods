name: build-cobblemon

# Eigener Job, weil der Cobblemon-Zweig auf Minecraft 1.21.1 baut und sich mit dem
# 26.2-Build weder Klassenpfad noch Loom-Version teilen darf.
on:
  push:
    paths:
      - 'cobblemon/**'
      - '.github/workflows/build-cobblemon.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cobblemon
    steps:
      - uses: actions/checkout@v4

      # Java 21, nicht 25: Gradle 8.12 (noetig fuer Loom 1.9) laeuft nicht auf 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Bestaetigt (Juli 2026): Fabric hat die Plugin-Marker der alten Loom-Zeilen
      # abgeraeumt, die Artefakte liegen aber noch da — daher der buildscript-Weg in
      # cobblemon/build.gradle. Probe bleibt fuer den naechsten Versionswechsel liegen,
      # zum Aktivieren "if: false" entfernen.
      - name: Toolchain probe
        if: false
        continue-on-error: true
        run: |
          echo "=== fabric-loom: Artefakt-Verzeichnis ==="
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/ \
            | grep -oE '>[0-9][^<]*/<' | tr -d '></' | tail -60
          echo "=== fabric-api fuer 1.21.1 ==="
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
            | tr '<' '\n' | sed -n 's/^version>//p' | grep '1\.21\.1$' | tail -8

      - name: Build Cobblemon add-ons
        run: ./gradlew build --continue

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horsti-cobblemon
          path: cobblemon/*/build/libs/*.jar
          if-no-files-found: ignore

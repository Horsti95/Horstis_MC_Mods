name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Bei Bedarf (neue Mods, unbekannte 26.x-APIs) aktivierbar: if: false entfernen
      # und die Klassenliste anpassen.
      - name: API dump
        continue-on-error: true
        run: |
          ./gradlew :core:printCoreClasspath -q || true
          CP=$(cat build/core-classpath.txt)
          d() { echo "=====CLASS $1"; javap -classpath "$CP" "$1" 2>&1 | grep -E "$2" | head -26; }
          d 'net.minecraft.world.entity.ai.attributes.Attributes' 'MAX_HEALTH|MOVEMENT_SPEED|ATTACK_DAMAGE|ARMOR;|KNOCKBACK|JUMP|SAFE_FALL|FALL_DAMAGE|BLOCK_BREAK|MAX_ABSORPTION|SCALE|OXYGEN|BURNING'
          d 'net.minecraft.world.entity.ai.attributes.AttributeInstance' 'setBaseValue|getBaseValue|addOrUpdate|addPermanent|removeModifier|getModifier'
          d 'net.minecraft.world.entity.ai.attributes.AttributeModifier' 'public'
          d 'net.minecraft.world.entity.ai.attributes.AttributeModifier$Operation' 'public static final'
          d 'net.minecraft.world.entity.LivingEntity' 'getAttribute|getMaxHealth|heal|getHealth|setCustomName|getActiveEffects'
          d 'net.minecraft.world.entity.Entity' 'setCustomName|getCustomName|setCustomNameVisible|remove\(|kill\(|moveTo|setGlowing|hasGlowing'
          d 'net.minecraft.world.entity.Mob' 'setTarget|getTarget|setPersistenceRequired|isPersistenceRequired|setItemSlot|equipItem|finalizeSpawn'
          d 'net.minecraft.world.entity.EntityType' 'public net.minecraft.world.entity.Entity spawn|create\(|byString|getKey|loadEntityRecursive'
          d 'net.minecraft.world.entity.EntitySpawnReason' 'public static final'
          d 'net.minecraft.world.level.border.WorldBorder' 'setSize|lerpSizeBetween|setCenter|getSize|setAbsoluteMaxSize'
          d 'net.minecraft.world.entity.TamableAnimal' 'isTame|getOwner|isOrderedToSit|setOrderedToSit|setInSittingPose'
          d 'net.minecraft.world.entity.OwnableEntity' '.'
          d 'net.minecraft.world.item.component.LodestoneTracker' 'public'
          d 'net.minecraft.core.component.DataComponents' 'LODESTONE|CUSTOM_NAME;'
          d 'net.minecraft.world.item.ItemStack' 'public <T> T set\(|public .* get\(|setCount|getCount|copy\(|isEmpty|shrink|is\('
          d 'net.minecraft.core.GlobalPos' 'public'
          d 'net.minecraft.world.level.Level' 'getWorldBorder|getBlockEntity|isNight|isDay|getDayTime|dimension\(|addFreshEntity'
          d 'net.minecraft.server.level.ServerLevel' 'setDayTime|getDayTime|sendParticles|getServer|isNight|getWorldBorder|players\(|getEntity\('
          d 'net.minecraft.world.Container' 'setItem|getItem|getContainerSize|clearContent'
          d 'net.minecraft.world.level.block.Blocks' ' CHEST;| PLAYER_HEAD;| BARRIER;'
          d 'net.minecraft.world.entity.player.Player' 'giveExperiencePoints|experienceLevel|totalExperience|getInventory|setGameMode|drop\('
          d 'net.minecraft.server.level.ServerPlayer' 'setGameMode|gameMode|giveExperience|setRespawnPosition|getRespawn'
          d 'net.minecraft.world.entity.player.Inventory' 'getContainerSize|getItem|setItem|add\(|clearContent|getNonEquipment|dropAll'
          d 'net.minecraft.world.entity.projectile.LargeFireball' 'public'
          d 'net.minecraft.world.entity.projectile.AbstractHurtingProjectile' 'public'
          d 'net.minecraft.server.MinecraftServer' 'overworld|getLevel\(|getWorldPath|isSingleplayer'
          d 'net.minecraft.world.level.storage.LevelResource' 'public static final'
          d 'net.minecraft.world.entity.EquipmentSlot' 'public static final'
          d 'net.minecraft.world.item.Items' ' COMPASS;| NETHER_STAR;| PLAYER_HEAD;'
          d 'net.minecraft.core.BlockPos' 'containing|above\(|below\(|offset'
          d 'net.minecraft.world.level.block.state.BlockState' '.'
          d 'net.minecraft.world.scores.TeamColor' 'public static final'
          d 'net.minecraft.core.Holder' 'value\(|is\('
          d 'net.minecraft.world.entity.LivingEntity' 'hurt|addEffect|removeEffect|removeAllEffects|isDeadOrDying|setHealth|getMainHandItem|isAlive'
          d 'net.minecraft.world.entity.Entity' 'teleportTo|position\(|getBlockX|getBlockY|getBlockZ| level\(|addTag|discard|isPassenger|stopRiding|startRiding|setPos|getXRot|getYRot|damageSources|isShiftKeyDown|getUUID|isRemoved|ejectPassengers|isVehicle|getVehicle|getX\(|getName|setInvisible|setNoGravity|setInvulnerable'
          d 'net.minecraft.world.entity.player.Player' 'drop\(|isCreative|getInventory|getFoodData'
          d 'net.minecraft.world.entity.player.Inventory' ' add\(|getItem\(|getContainerSize'
          d 'net.minecraft.world.food.FoodData' 'addExhaustion'
          d 'net.minecraft.world.effect.MobEffects' 'SPEED|GLOWING|REGENERATION|ABSORPTION|FIRE_RES|WITHER|MOVEMENT'
          d 'net.minecraft.world.effect.MobEffectInstance' 'public net.minecraft.world.effect.MobEffectInstance'
          d 'net.minecraft.world.damagesource.DamageSources' 'generic|magic'
          d 'net.minecraft.world.damagesource.DamageSource' 'getEntity|is\('
          d 'net.minecraft.server.level.ServerBossEvent' '.'
          d 'net.minecraft.world.BossEvent' 'setName|setProgress|BossBarColor|BossBarOverlay'
          d 'net.minecraft.world.InteractionResult' '.'
          d 'net.minecraft.world.scores.Scoreboard' 'addPlayerTeam|getPlayerTeam|addPlayerToTeam|removePlayerFromTeam'
          d 'net.minecraft.world.scores.PlayerTeam' 'setColor|setSuffix'
          d 'net.minecraft.world.inventory.AnvilMenu' 'createResult|calculateIncreasedRepairCost|cost|onTake'
          d 'net.minecraft.world.inventory.DataSlot' '.'
          d 'net.minecraft.world.level.GameRules' 'getBoolean|RULE_MOBGRIEFING'
          d 'net.minecraft.world.level.Level' 'explode|ExplosionInteraction|playSound|getBlockState|setBlock\('
          d 'net.minecraft.server.level.ServerLevel' 'explode|addFreshEntity|broadcastEntityEvent|getEntitiesOfClass'
          d 'net.minecraft.world.level.Level$ExplosionInteraction' '.'
          d 'net.minecraft.world.level.block.CropBlock' 'isMaxAge|getStateForAge|AGE'
          d 'net.minecraft.world.level.block.NetherWartBlock' 'AGE'
          d 'net.minecraft.world.level.block.CocoaBlock' 'AGE'
          d 'net.minecraft.world.level.block.Block' 'getDrops|popResource|asItem'
          d 'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase' 'getSoundType|isAir|setValue|getValue|is\(|getBlock\('
          d 'net.minecraft.world.level.block.SoundType' 'getBreakSound'
          d 'net.minecraft.world.level.block.StairBlock' 'HALF'
          d 'net.minecraft.world.level.block.SlabBlock' 'TYPE'
          d 'net.minecraft.tags.DamageTypeTags' 'BYPASSES'
          d 'net.minecraft.core.Registry' 'getValue|getKey'
          d 'net.minecraft.core.registries.BuiltInRegistries' 'ITEM'
          d 'net.minecraft.commands.arguments.EntityArgument' 'player|getPlayer'
          d 'net.minecraft.commands.arguments.item.ItemArgument' '.'
          d 'net.minecraft.commands.arguments.item.ItemInput' 'createItemStack|getItem'
          d 'net.minecraft.server.MinecraftServer' 'reloadResources|getPackRepository|getScoreboard|getPlayerList|getAllLevels'
          d 'net.minecraft.server.packs.repository.PackRepository' 'getSelectedIds|getAvailableIds'
          d 'net.minecraft.server.players.PlayerList' 'broadcastSystemMessage|getPlayers|getPlayer\('
          d 'net.minecraft.server.network.ServerGamePacketListenerImpl' 'send\(|disconnect'
          d 'net.minecraft.network.protocol.game.ClientboundSetActionBarTextPacket' 'public'
          d 'net.minecraft.network.protocol.game.ClientboundSetTitleTextPacket' 'public'
          d 'net.minecraft.network.protocol.game.ClientboundSetSubtitleTextPacket' 'public'
          d 'net.minecraft.world.entity.decoration.ArmorStand' 'public|setSmall|setMarker'
          d 'net.minecraft.world.entity.item.ItemEntity' 'PickUp|getItem'
          d 'net.minecraft.world.level.GameType' '.'
          d 'net.minecraft.network.chat.Component' 'literal|empty'
          d 'net.minecraft.network.chat.MutableComponent' 'append|withStyle'
          d 'net.minecraft.network.chat.Style' 'withClickEvent|withColor'
          d 'net.minecraft.resources.ResourceLocation' 'fromNamespaceAndPath|parse'
          d 'net.minecraft.world.phys.AABB' 'ofSize|inflate'
          d 'net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents' '.'
          d 'net.fabricmc.fabric.api.entity.event.v1.ServerPlayerEvents' '.'
          d 'net.fabricmc.fabric.api.event.player.AttackEntityCallback' '.'
          d 'net.fabricmc.fabric.api.event.player.UseBlockCallback' '.'
          d 'net.fabricmc.fabric.api.resource.ResourceManagerHelper' 'registerBuiltinResourcePack'
          d 'net.fabricmc.fabric.api.resource.ResourcePackActivationType' '.'
          d 'net.fabricmc.fabric.api.message.v1.ServerMessageEvents' 'CHAT'
          d 'net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents' 'JOIN|DISCONNECT'
          d 'net.minecraft.server.permissions.PermissionCheck' '.'
          d 'net.minecraft.server.permissions.PermissionSet' 'hasPermission|contains'

      - name: Build all mods
        run: ./gradlew build --continue --stacktrace

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horsti-mods
          path: |
            core/build/libs/*.jar
            mods/*/build/libs/*.jar
          if-no-files-found: ignore

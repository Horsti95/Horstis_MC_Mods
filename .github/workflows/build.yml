name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Druckt echte 26.x-Signaturen statt zu raten. Wenn keine neuen APIs anstehen:
      # "if: false" wieder einfuegen, dann bleibt das Log kurz.
      - name: API dump
        continue-on-error: true
        run: |
          ./gradlew :core:printCoreClasspath -q || true
          CP=$(cat build/core-classpath.txt)
          d() { echo "=====CLASS $1"; javap -classpath "$CP" "$1" 2>&1 | grep -E "$2" | head -60; }

          # Klassen-Index: findet umbenannte/verschobene Klassen, die javap sonst nicht findet.
          echo "$CP" | tr ':' '\n' | while read -r j; do
            [ -f "$j" ] && unzip -Z1 "$j" 2>/dev/null | grep '\.class$'
          done | sed 's/\.class$//' | tr '/' '.' | sort -u > /tmp/classes.txt
          echo "############ KLASSEN-INDEX ############"
          echo "--- keybinding/keymapping ---"; grep -iE 'keybind|keymapping' /tmp/classes.txt | grep -v '\$' | head -20
          echo "--- fabric rendering/hud ---"; grep -E '^net\.fabricmc\.fabric\.api\.client\.(rendering|screen|keybinding)' /tmp/classes.txt | grep -v '\$' | head -30
          echo "--- GuiGraphics* ---"; grep -E 'client\.gui\.GuiGraphics' /tmp/classes.txt | head -10

          echo "############ HUD-RENDERING ############"
          d 'net.minecraft.client.gui.GuiGraphics' 'public'
          d 'net.minecraft.client.gui.GuiGraphicsExtractor' 'public'
          d 'net.minecraft.client.Options' 'keyMappings'
          d 'net.minecraft.client.Minecraft' 'font|Font'
          d 'net.minecraft.network.protocol.common.custom.CustomPacketPayload' '.'
          d 'net.minecraft.network.protocol.common.custom.CustomPacketPayload$Type' '.'
          d 'net.minecraft.resources.ResourceKey' 'public'

      - name: Build all mods
        run: ./gradlew build --continue --stacktrace

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horsti-mods
          path: |
            core/build/libs/*.jar
            mods/*/build/libs/*.jar
          if-no-files-found: ignore

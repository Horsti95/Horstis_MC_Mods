name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Offen ist nur noch, wohin Fabric die Keybind-Registrierung verschoben hat
      # (KeyBindingHelper ist aus …client.keybinding.v1 verschwunden). Der Rest der
      # 26.x-Signaturen ist geklaert. Ganz abschaltbar mit "if: false".
      - name: API dump
        continue-on-error: true
        run: |
          ./gradlew :core:printCoreClasspath -q || true
          CP=$(cat build/core-classpath.txt)
          # Klassen-Index per python3 (unzip fehlt auf dem Runner). Einzeiler, weil die
          # YAML-Blockeinrueckung sonst Pythons eigene Einrueckung kaputtmacht.
          python3 -c "import sys,zipfile,os;print(chr(10).join(sorted({n[:-6].replace('/','.') for e in sys.argv[1].split(os.pathsep) if e.endswith('.jar') and os.path.isfile(e) for n in zipfile.ZipFile(e).namelist() if n.endswith('.class')})))" "$CP" > /tmp/classes.txt || true
          echo "############ KLASSEN-INDEX ($(wc -l < /tmp/classes.txt) Klassen) ############"
          echo "--- keybind ---"; grep -iE 'keybind' /tmp/classes.txt | grep -v '\$' | head -20
          echo "--- fabric client api ---"; grep -E '^net\.fabricmc\.fabric\.api\.client\.[a-z]+\.v[0-9]+\.[A-Z]' /tmp/classes.txt | grep -v '\$' | head -40

      - name: Build all mods
        run: ./gradlew build --continue

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horsti-mods
          path: |
            core/build/libs/*.jar
            mods/*/build/libs/*.jar
          if-no-files-found: ignore

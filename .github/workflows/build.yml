name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Druckt echte 26.x-Signaturen statt zu raten. Wenn keine neuen APIs anstehen:
      # "if: false" wieder einfuegen, dann bleibt das Log kurz.
      - name: API dump
        continue-on-error: true
        run: |
          ./gradlew :core:printCoreClasspath -q || true
          CP=$(cat build/core-classpath.txt)
          d() { echo "=====CLASS $1"; javap -classpath "$CP" "$1" 2>&1 | grep -E "$2" | head -40; }

          echo "############ REFILL / SPAWNGUARD ############"
          d 'net.minecraft.world.entity.player.Inventory' 'getContainerSize|getItem\(|setItem|Selected|selected|getNonEquipment'
          d 'net.minecraft.world.item.ItemStack' 'isEmpty|getCount|is\(|has\(|isDamageableItem|getHoverName|public net.minecraft.world.item.Item getItem'
          d 'net.minecraft.world.entity.LivingEntity' 'setItemInHand|getMainHandItem'
          d 'net.minecraft.world.entity.player.Player' 'containerMenu|inventoryMenu|getInventory'
          d 'net.minecraft.core.component.DataComponents' ' FOOD;| CONSUMABLE;'
          d 'net.minecraft.world.item.BlockItem' 'public net.minecraft.world.item.BlockItem'
          d 'net.minecraft.world.entity.Mob' 'checkSpawnRules|finalizeSpawn'
          d 'net.minecraft.world.entity.EntitySpawnReason' 'public static final'
          d 'net.minecraft.world.entity.MobCategory' 'public static final'
          d 'net.minecraft.world.entity.EntityType' 'getCategory'
          d 'net.minecraft.world.entity.Entity' 'blockPosition|public net.minecraft.world.level.Level level'
          d 'net.minecraft.world.level.Level' 'dimension\('
          d 'net.minecraft.resources.ResourceKey' 'location'

          echo "############ HUD: NETZWERK ############"
          d 'net.minecraft.network.protocol.common.custom.CustomPacketPayload' '.'
          d 'net.minecraft.network.protocol.common.custom.CustomPacketPayload$Type' '.'
          d 'net.minecraft.network.codec.StreamCodec' 'composite|unit|of\('
          d 'net.minecraft.network.codec.ByteBufCodecs' 'STRING_UTF8|stringUtf8|VAR_INT'
          d 'net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry' '.'
          d 'net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking' 'canSend|send\('
          d 'net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking' 'registerGlobalReceiver|PlayPayloadHandler'
          d 'net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking$Context' '.'

          echo "############ HUD: CLIENT/RENDER ############"
          d 'net.minecraft.client.Minecraft' 'getInstance|public net.minecraft.client.gui.Font|public net.minecraft.client.player|getWindow|options'
          d 'net.minecraft.client.gui.GuiGraphics' 'drawString|fill\(|guiWidth|guiHeight'
          d 'net.minecraft.client.gui.Font' 'public int width'
          d 'net.minecraft.client.KeyMapping' 'public|consumeClick|isDown'
          d 'net.minecraft.client.KeyMapping$Category' '.'
          d 'net.minecraft.client.DeltaTracker' '.'
          d 'com.mojang.blaze3d.platform.InputConstants$Type' 'public static final'
          d 'net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper' '.'
          d 'net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents' '.'
          d 'net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry' '.'
          d 'net.fabricmc.fabric.api.client.rendering.v1.hud.HudElement' '.'
          d 'net.fabricmc.fabric.api.client.rendering.v1.hud.VanillaHudElements' 'public static final'
          d 'net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback' '.'
          d 'net.fabricmc.api.ClientModInitializer' '.'


      - name: Build all mods
        run: ./gradlew build --continue --stacktrace

      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horsti-mods
          path: |
            core/build/libs/*.jar
            mods/*/build/libs/*.jar
          if-no-files-found: ignore
